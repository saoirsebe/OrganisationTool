services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: usertaskdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d usertaskdb" ]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/usertaskdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
